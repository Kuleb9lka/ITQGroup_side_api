spring:
  application:
    name: ITQGroup_side_api
server:
  port: 8089

api:
  documents:
    url: http://localhost:8088

document-batch-creation:
  file:
    path: src/main/resources/static/document-batch-creation-file.txt

logging:
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/app.%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 7
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"
  level:
    root: info